name: Roadmap CI

on:
  push:
    branches:
      - feature/multi-competition-roadmap
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://perfectxv:perfectxv@127.0.0.1:5432/perfectxv
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      SESSION_SECRET: ci-session-secret-ci-session-secret
      STRIPE_SECRET_KEY: sk_test_ci_placeholder
      STRIPE_WEBHOOK_SECRET: whsec_ci_placeholder
      RESEND_API_KEY: re_ci_placeholder
      API_SPORTS_KEY: ci_placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npx tsc --noEmit
      - run: npx next build
      - name: Run multi-competition regression tests
        run: >
          npx vitest run
          src/lib/fixtureDiscovery.test.ts
          src/lib/fixtureImport.test.ts
          src/lib/competitionReadiness.test.ts
          src/lib/competitionTitle.test.ts
          src/lib/predictionLocking.test.ts
          src/lib/knockoutBracket.test.ts
          src/lib/liveScoring.test.ts
          src/app/api/admin/competitions/fixtures/preview/route.test.ts
          src/app/api/admin/competitions/route.test.ts
          src/app/api/matches/route.test.ts
          src/app/api/leaderboard/route.test.ts
          src/app/api/predictions/route.test.ts
          src/app/api/predictions/list/route.test.ts
          src/app/api/stripe/create-checkout-session/route.test.ts
          src/app/api/account/route.test.ts
