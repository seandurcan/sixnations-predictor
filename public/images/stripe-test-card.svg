<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">Stripe test card details for Perfect XV testing</title>
  <desc id="desc">A test-only payment card showing Stripe test card number 4242 4242 4242 4242, expiry 12/34 and CVC 123. No real payment will be taken.</desc>
  <rect width="1200" height="680" rx="44" fill="#f7f7ff"/>
  <rect x="55" y="55" width="1090" height="570" rx="38" fill="#ffffff" stroke="#635bff" stroke-width="8"/>
  <text x="110" y="150" font-family="Arial, Helvetica, sans-serif" font-size="72" font-weight="700" fill="#635bff">stripe</text>
  <text x="1090" y="145" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#0b1f34">TEST CARD</text>
  <rect x="110" y="205" width="980" height="80" rx="16" fill="#fff4d6"/>
  <text x="600" y="257" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#7a4a00">NO REAL PAYMENT WILL BE TAKEN</text>
  <text x="110" y="365" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#64748b">CARD NUMBER</text>
  <text x="110" y="425" font-family="Courier New, monospace" font-size="58" font-weight="700" fill="#0b1f34">4242 4242 4242 4242</text>
  <text x="110" y="510" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#64748b">EXPIRY</text>
  <text x="110" y="560" font-family="Courier New, monospace" font-size="42" font-weight="700" fill="#0b1f34">12 / 34</text>
  <text x="480" y="510" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#64748b">CVC</text>
  <text x="480" y="560" font-family="Courier New, monospace" font-size="42" font-weight="700" fill="#0b1f34">123</text>
  <text x="1090" y="510" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#64748b">NAME / POSTCODE</text>
  <text x="1090" y="560" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="30" fill="#0b1f34">Any valid test details</text>
</svg>